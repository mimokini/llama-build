# 每周检查一次上游：有新提交才构建，没有就十几秒结束
# 上次构建到的 commit 记在本仓库的 build-state 分支（只放一个 last-sha.txt）
# 目标机: Amlogic S905X3 (4x Cortex-A55) / Armbian 26.11 / Debian 13 trixie
name: Weekly Build llama-server for S905X3 (ARM64)

on:
  schedule:
    # 每周一 03:17 UTC = 北京时间 11:17
    - cron: '17 3 * * 1'
  workflow_dispatch:        # 手动触发时无视"有无更新"，强制构建

permissions:
  contents: write           # 仅用于写 build-state 分支，不碰源码

concurrency:
  group: llama-s905x3-weekly
  cancel-in-progress: true

env:
  UPSTREAM_REPO: ggml-org/llama.cpp
  STATE_BRANCH: build-state
  MARCH: armv8.2-a+dotprod+fp16    # A55 实测有 asimdhp + asimddp

jobs:
  build:
    runs-on: ubuntu-24.04-arm      # 放在公开仓库是 4 vCPU / 免费无限
    timeout-minutes: 180

    steps:
      # ---------- 1. 上游最新 SHA vs 上次构建的 SHA ----------
      - name: Resolve upstream master
        id: up
        run: |
          SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/master | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::无法解析上游 master"
            exit 1
          fi
          echo "upstream master = $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Read last built commit
        id: last
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "::add-mask::${TOKEN}"
          # build-state 分支里的单文件；分支/文件不存在时 curl 返回空，视为"从没构建过"
          LAST=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
                   -H "Accept: application/vnd.github.raw" \
                   "https://api.github.com/repos/${{ github.repository }}/contents/last-sha.txt?ref=${STATE_BRANCH}" \
                 || true)
          LAST=$(printf '%s' "$LAST" | tr -d '[:space:]')
          echo "last built = ${LAST:-<none>}"
          echo "sha=$LAST" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: gate
        env:
          PREV: ${{ steps.last.outputs.sha }}
        run: |
          if [ -n "$PREV" ] && [ "$PREV" = "${{ steps.up.outputs.sha }}" ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "### 上游仍是 ${{ steps.up.outputs.short }}，与上次构建相同，本次跳过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "### 开始构建：${PREV:-<none>} → ${{ steps.up.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------- 2. 构建 ----------
      - name: Checkout upstream llama.cpp
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.up.outputs.sha }}
          path: src
          fetch-depth: 1
          persist-credentials: false   # 不在工作区留下 GITHUB_TOKEN

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Restore ccache
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ steps.up.outputs.sha }}
          restore-keys: |
            ccache-

      - name: Configure
        if: steps.gate.outputs.build == 'true'
        timeout-minutes: 20      # KleidiAI 下载 / 编译器探测卡住时快速失败，而不是干等 3 小时
        working-directory: src
        env:
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: '1'
        run: |
          # 注意：-static-libgomp 不被 gcc 的 C 驱动识别（CMake 探测编译器时会直接报错），
          # 所以 libgomp 保持动态链接，板子上要有 libgomp1（Debian 系一般自带）。
          # 注释必须放在 cmake 命令之前：续行符 \ 中间夹注释会把命令截断。
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=${MARCH}" \
            -DCMAKE_CXX_FLAGS="-march=${MARCH}" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ARM_ARCH="${MARCH}" \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_REPACK=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LTO=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CCACHE=ON

      - name: Build llama-server
        if: steps.gate.outputs.build == 'true'
        working-directory: src
        run: |
          cmake --build build --target llama-server -j "$(nproc)"

      - name: Smoke test
        if: steps.gate.outputs.build == 'true'
        working-directory: src
        run: |
          ./build/bin/llama-server --version | tee /tmp/version.txt
          file build/bin/llama-server | tee /tmp/arch.txt
          ls -lh build/bin/llama-server

      # 先验功能再瘦身：strip 掉符号表，体积通常减一半以上，运行不受影响
      - name: Strip & checksum
        if: steps.gate.outputs.build == 'true'
        working-directory: src
        run: |
          strip --strip-unneeded build/bin/llama-server
          ls -lh build/bin/llama-server
          ( cd build/bin && sha256sum llama-server > llama-server.sha256 && cat llama-server.sha256 )

      - name: Write build info
        if: steps.gate.outputs.build == 'true'
        working-directory: src
        env:
          SHA: ${{ steps.up.outputs.sha }}
          PREV: ${{ steps.last.outputs.sha }}
        run: |
          {
            echo "upstream : ${UPSTREAM_REPO}"
            echo "commit   : ${SHA}"
            echo "previous : ${PREV:-<none>}"
            echo "built_at : $(date -u +%FT%TZ)"
            echo "target   : Amlogic S905X3 / 4x Cortex-A55, ${MARCH}"
            echo "runner   : $(uname -m) / $(nproc) vCPU"
            echo "version  : $(head -1 /tmp/version.txt)"
          } > build/BUILD_INFO.txt
          cat build/BUILD_INFO.txt

      - name: Upload artifact
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-s905x3-arm64-${{ steps.up.outputs.short }}
          retention-days: 14       # Release 里已永久归档，artifact 只留近期方便回看
          path: |
            src/build/bin/llama-server
            src/build/BUILD_INFO.txt

      # ---------- 3. 发 Release：每个 commit 一个 tag，最新那个自动成为 latest ----------
      # asset 文件名保持固定的 llama-server，这样板子上可以用一个永不变化的 URL：
      #   https://github.com/<owner>/<repo>/releases/latest/download/llama-server
      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.up.outputs.sha }}
          SHORT: ${{ steps.up.outputs.short }}
          MARCH: ${{ env.MARCH }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="s905x3-${SHORT}"
          DATE=$(date -u +%F)

          {
            echo "**上游**: \`${UPSTREAM_REPO}@${SHA}\`"
            echo "**构建时间**: ${DATE} (UTC)"
            echo "**目标**: Amlogic S905X3 / 4x Cortex-A55, \`${MARCH}\`"
            echo ""
            echo "**板子上更新（固定地址，不用管版本号）**："
            echo ""
            echo "\`\`\`"
            echo "curl -fL -o llama-server.new \\"
            echo "  https://github.com/${REPO}/releases/latest/download/llama-server"
            echo "curl -fsSL https://github.com/${REPO}/releases/latest/download/llama-server.sha256 \\"
            echo "  | awk '{print \$1\"  llama-server.new\"}' | sha256sum -c -"
            echo "mv llama-server.new llama-server && chmod +x llama-server"
            echo "\`\`\`"
            echo ""
            echo "产物为静态链接 libgcc/libstdc++，板子上需有 \`libgomp1\`；未开 mlock，内存占用随上下文增长。"
          } > /tmp/notes.md

          ASSETS="src/build/bin/llama-server src/build/bin/llama-server.sha256 src/build/BUILD_INFO.txt"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # 同一次 commit 被手动重跑：覆盖 asset，不重建 release
            gh release upload "$TAG" $ASSETS --clobber --repo "$REPO"
          else
            gh release create "$TAG" $ASSETS \
              --repo "$REPO" \
              --title "llama-server ${SHORT} (S905X3)" \
              --notes-file /tmp/notes.md
          fi

          echo "### 已发布 ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # 只留最近 KEEP 个，多了就把最旧的（连 tag 一起）删掉。
      # 只清 s905x3- 前缀的，手动建的其它 release 不受影响；
      # 清理失败也不把这次成功的构建判红。
      - name: Prune old releases
        if: steps.gate.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: 10
        run: |
          set -euo pipefail
          OLD=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${REPO}/releases?per_page=100" \
                | jq -r --argjson keep "$KEEP" '
                    [ .[] | select(.tag_name | startswith("s905x3-")) ]
                    | sort_by(.created_at) | reverse
                    | .[$keep:]
                    | .[] | [.tag_name, .created_at] | @tsv')

          if [ -z "$OLD" ]; then
            echo "无需清理：s905x3- 前缀的 release 不超过 ${KEEP} 个"
            exit 0
          fi

          echo "$OLD" | while IFS=$'\t' read -r tag created; do
            echo "删除旧 release: ${tag} (${created})"
            gh release delete "$tag" --yes --cleanup-tag --repo "$REPO"
          done
          echo "### 已把 release 收敛到最近 ${KEEP} 个" >> "$GITHUB_STEP_SUMMARY"

      # ---------- 3. 构建成功后才记录 SHA（避免失败也被当成"已构建"） ----------
      # 需要 Settings → Actions → General → Workflow permissions 选 "Read and write"，
      # 否则 GitHub_TOKEN 拿不到写权限，这一步会 403
      - name: Record built commit
        if: steps.gate.outputs.build == 'true'
        env:
          SHA: ${{ steps.up.outputs.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${TOKEN}"
          rm -rf state && mkdir state && cd state
          git init --quiet
          git checkout --quiet --orphan "${STATE_BRANCH}"
          printf '%s\n' "$SHA" > last-sha.txt
          git add last-sha.txt
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "built llama.cpp@${SHA:0:8}"
          git push --quiet --force \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            "${STATE_BRANCH}:${STATE_BRANCH}"
          echo "### 已记录 ${SHA:0:8} 到 ${STATE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
